<!DOCTYPE html>
<html lang=""fr">
    <head>
        <meta charset="UTF-8">
        <title>Valentine</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #f7c1d9, #fbe7f0);
                font-family: Arial, sans-serif;
                overflow: hidden;
            }

            .carte {
                text-align: center;
                background: #ffffffcc;
                padding: 40px, 60px;
                border-radius: 20px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
                width: 420px;
                position: relative;
            }

            #question h1{
                color: #c2185b;
                margin-bottom: 30px;
            }

            .boutons{
                display: flex;
                justify-content: center;
                gap: 20px;
                position: relative;
                height: 60px;
            }

            button{
                width: 110px;
                height: 44px;
                font-size: 16px;
                border: none;
                border-radius: 22px;
                cursor: pointer;
            }

            .yes{
                background-color: #4caf50;
                color: white;
            }

            .no{
                background-color: #f44336;
                color: white;
                position: relative;
            }

            #warning{
                display: none;
                
            }

            #warning img{
                width: 200px;
                border-radius: 15px;
                border: 4px solid #d32f2f;
            }

            #warning h2{
                color: #d32f2f;
                margin-bottom: 15px;
            }

            .confetti{
                position: fixed;
                width: 10px;
                height: 10px;
                background-color: red;
                top: -10px;
                animation: fall 3s linear forwards;
            }

            @keyframes fall{
                to{
                    transform: translateY(110vh) rotate(720deg);
                    opacity: 0;
                }
            }
        </style>
    </head>

    <body>
        <div class="carte">
            <div id="question">
                <h1>SEYE veux tu être ma valentine?</h1>

                <div class="boutons">
                    <button class="yes" id="yesBtn">OUI</button>
                    <button class="no" id="noBtn">NON</button>
                </div>
            </div>

             <div id="warning">
                <h2>Fais le bon choix mon frère!</h2>
                <img src="image.jpg" alt="Message">
                <br><br>
                <button class="yes" id="finalYes">OUI</button>
             </div>

             <div id="final" style="display:none;">
                <h2 style="color: #c2185b;">Excellent choix mon coeur</h2>
                <img src="image1.jpg" alt="final" style="width: 260px; border-radius: 15px; border: 4px solid #c2185b;">
             </div>
        </div>

        <script>
            const noBtn=document.getElementById("noBtn");
            const question=document.getElementById("question");
            const warning=document.getElementById("warning");
            const yesBtn=document.getElementById("yesBtn");
            const finalYes=document.getElementById("finalYes");
            let attempts=0;

            noBtn.addEventListener("mouseenter", () => {
                attempts++;
                const x = Math.random() * 160 - 80;
                const y = Math.random() * 40 - 20;
                noBtn.style.transform=`translate(${x}px, ${y}px)`;

                if (attempts>=5){
                    question.style.display="none";
                    warning.style.display="block";
                }
            });

            function launchConfetti(){
                for(let i=0; i<120 ; i++){
                    const confetti=document.createElement("div");
                    confetti.classList.add("confetti");
                    confetti.style.left = Math.random() * 100+"vw";
                    confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
                    confetti.style.animationDuration = Math.random() * 2 + 2 + "s";
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }
                setTimeout(() => {
                   question.style.display = "none";
                   warning.style.display = "none";
                   document.getElementById("final").style.display = "block"; 
                }, 800);
            }

            yesBtn.onclick = launchConfetti;
            finalYes.onclick = launchConfetti;
        </script>
       
    </body>
</html>
